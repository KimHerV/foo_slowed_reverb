name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # creating releases on tag pushes

env:
  SDK_VERSION: SDK-2026-10-01
  CUI_SDK_VERSION: 8.1.0

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags, for the release notes' compare link

      - name: Core tests
        shell: cmd
        run: |
          call test\build_test.cmd || exit /b 1
          test\test_core.exe

      - name: Cache foobar2000 SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\sdk
          key: fb2k-${{ env.SDK_VERSION }}-cui-${{ env.CUI_SDK_VERSION }}-libs-v1

      - name: Download and build foobar2000 SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          curl -fsSL -o "%RUNNER_TEMP%\sdk.7z" https://www.foobar2000.org/downloads/%SDK_VERSION%.7z || exit /b 1
          7z x "%RUNNER_TEMP%\sdk.7z" -o"%RUNNER_TEMP%\sdk" -y >nul || exit /b 1
          rem Columns UI SDK goes inside the foobar2000 SDK folder, next to pfc (it includes ../pfc/pfc.h).
          curl -fsSL -o "%RUNNER_TEMP%\cui.zip" https://github.com/reupen/columns_ui-sdk/archive/refs/tags/v%CUI_SDK_VERSION%.zip || exit /b 1
          7z x "%RUNNER_TEMP%\cui.zip" -o"%RUNNER_TEMP%" -y >nul || exit /b 1
          move "%RUNNER_TEMP%\columns_ui-sdk-%CUI_SDK_VERSION%" "%RUNNER_TEMP%\sdk\columns_ui-sdk" || exit /b 1
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VS=%%i"
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" >nul
          cd /d "%RUNNER_TEMP%\sdk"
          for %%A in (Win32 x64) do (
            for %%P in (pfc\pfc.vcxproj foobar2000\SDK\foobar2000_SDK.vcxproj foobar2000\foobar2000_component_client\foobar2000_component_client.vcxproj) do (
              msbuild %%P /p:Configuration=Release /p:Platform=%%A /m /nologo /v:minimal || exit /b 1
            )
          )
          rem ARM64EC is optional: the x64 build already runs on foobar2000 for ARM.
          for %%P in (pfc\pfc.vcxproj foobar2000\SDK\foobar2000_SDK.vcxproj foobar2000\foobar2000_component_client\foobar2000_component_client.vcxproj) do (
            msbuild %%P /p:Configuration=Release /p:Platform=ARM64EC /m /nologo /v:minimal
          )
          exit /b 0

      - name: Build component (ARM64EC, optional)
        continue-on-error: true
        shell: cmd
        run: |
          set "SDK_DIR=%RUNNER_TEMP%\sdk"
          call build.cmd arm64ec

      - name: Build component (x86, x64) and package
        shell: cmd
        run: |
          set "SDK_DIR=%RUNNER_TEMP%\sdk"
          call build.cmd x86 x64

      - name: Name package
        id: pkg
        shell: pwsh
        run: |
          $ver = ((Select-String -Path src\version.h -Pattern 'SR_VERSION_(MAJOR|MINOR|PATCH) (\d+)').Matches | ForEach-Object { $_.Groups[2].Value }) -join '.'
          if ('${{ github.ref_type }}' -eq 'tag') {
            # The tag must match src\version.h (a prerelease suffix such as -beta.1 is allowed).
            $tagVer = '${{ github.ref_name }}'.TrimStart('v')
            if ($tagVer -notmatch "^$([regex]::Escape($ver))(-[0-9A-Za-z.]+)?$") { throw "Tag ${{ github.ref_name }} does not match src\version.h ($ver)" }
            $ver = $tagVer
          }
          $name = "foo_slowed_reverb-$ver.fb2k-component"
          Copy-Item build\foo_slowed_reverb.fb2k-component $name
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.name }}

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes per the KimHerV release convention. The CHANGELOG itself was already checked by the
          # pre-push hook (conventions folder), so this only assembles: section + SHA-256 + compare link.
          $tag = '${{ github.ref_name }}'
          $asset = '${{ steps.pkg.outputs.name }}'
          $lines = Get-Content CHANGELOG.md -Encoding UTF8
          $start = [Array]::FindIndex($lines, [Predicate[string]] { param($l) $l -match ('^#### ' + [regex]::Escape($tag) + ' \(\d{4}-\d{2}-\d{2}\)') })
          if ($start -lt 0) { throw "CHANGELOG.md has no dated '#### $tag (YYYY-MM-DD)' section" }
          $section = @(); for ($i = $start + 1; $i -lt $lines.Count -and $lines[$i] -notmatch '^#### '; $i++) { $section += $lines[$i] }
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          $prev = if ($tag -like '*-*') { git describe --tags --abbrev=0 "$tag^" 2>$null } else { git describe --tags --abbrev=0 --exclude '*-*' "$tag^" 2>$null }
          $notes = @(($section -join "`n").Trim(), '', '**SHA-256**', '', "    $hash  $asset", '', ('Verify: `Get-FileHash .\' + $asset + ' -Algorithm SHA256`'))
          if ($prev) { $notes += @('', "**Full Changelog**: [$prev...$tag](https://github.com/${{ github.repository }}/compare/$prev...$tag)") }
          [IO.File]::WriteAllText("$PWD\notes.md", ($notes -join "`n") + "`n", (New-Object System.Text.UTF8Encoding($false)))
          # One asset with the version in its name; prerelease tags (with a '-') are marked Pre-release.
          $flag = if ($tag -like '*-*') { '--prerelease' } else { '--latest' }
          gh release create $tag $asset --title $tag --notes-file notes.md --verify-tag $flag
